name: Generate JOP Java Silicon GDSII
on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  openlane_harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install GHDL and Yosys (VHDL Compiler Tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y ghdl yosys

      - name: Convert JOP VHDL to Verilog
        run: |
          # This compiles your core.vhdl into core.v so OpenLane can read it
          ghdl -a vhdl/core/core.vhdl
          yosys -p "ghdl core; write_verilog core.v"

      - name: Install OpenLane Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openlane

      - name: Run OpenLane Synthesis and Routing
        run: |
          python3 -m openlane --design-dir . --pdk sky130 config.json
